spring:
  application:
    name: pharmacy-digital-assistant

  # Yerel gelistirme icin proje kokundeki .env dosyasini (varsa) okur.
  # Ornek degerler icin .env.example dosyasina bakin.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pharmacy_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # 📧 MAIL CONFIGURATION
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}   # Gmail icin uygulama sifresi (bosluksuz)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.pharmacy.assistant: DEBUG
    org.springframework.web: DEBUG

pharmacy:
  email:
    from: ${MAIL_FROM:${MAIL_USERNAME}}
    from-name: "Eczane Dijital Asistan"
    reply-to: ${MAIL_FROM:${MAIL_USERNAME}}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000} # React uygulamanin adresi
